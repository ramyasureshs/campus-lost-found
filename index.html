<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎓 Campus Lost & Found</h1>
    <p>Lost something? Let's help you find it!</p>
</header>

<main>
    <section class="form-box">
        <h2>Report an Item</h2>

        <input id="itemName" placeholder="Item name">

        <select id="itemType">
            <option value="Lost">Lost Item</option>
            <option value="Found">Found Item</option>
        </select>

        <input id="location" placeholder="Location">
        <input id="date" type="date">

        <button onclick="addItem()">Submit Item</button>
    </section>

    <section class="items-box">
        <h2>Recently Reported Items</h2>

        <input id="search" placeholder="Search items..."
               oninput="displayItems()">

        <select id="filter" onchange="displayItems()">
            <option value="All">All Items</option>
            <option value="Lost">Lost Items</option>
            <option value="Found">Found Items</option>
        </select>

        <div id="items"></div>
    </section>
</main>

<footer>
    <p>Made with 💙 for our campus </p>
</footer>

<script src="script.js"></script>
</body>
</html>
